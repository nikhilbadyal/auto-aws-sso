name: Publish Python Package

on:
  push:
    tags:
      - 'v*'      # Trigger when pushing tags starting with "v"
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Where to publish the package'
        required: false
        default: 'testpypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x

      - name: Install dependencies (hatch)
        run: python -m pip install --upgrade pip hatch

      - name: Build package artifacts
        run: hatch build

      - name: Publish package
        env:
          HATCH_INDEX_USER: __token__
        run: |
          REPO="main"
          TOKEN="${{ secrets.PYPI_TOKEN }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.publish_target }}" == "testpypi" ]]; then
              echo "Manual trigger: Publishing to TestPyPI"
              REPO="test"
              TOKEN="${{ secrets.TEST_PYPI_TOKEN }}"
            else
              echo "Manual trigger: Publishing to PyPI"
            fi
          else
            # If triggered by tag push (v*), publish to PyPI
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "Tag push detected, publishing to PyPI"
            else
              # Optional: you can skip publishing for branch pushes if you want
              echo "Push event on branch, publishing to PyPI"
            fi
          fi

          export HATCH_INDEX_REPO=$REPO
          export HATCH_INDEX_AUTH=$TOKEN

          hatch publish dist/*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
